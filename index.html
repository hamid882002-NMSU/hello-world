<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World - Individual</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1a202c;
      --muted: #4a5568;
      --accent: #2b6cb0;
      --accent-hover: #2c5282;
      --border: #cbd5e0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.2);
    }

    button {
      margin-top: 16px;
      width: 100%;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-hover);
    }

    #output {
      margin-top: 24px;
      padding: 16px;
      border-left: 4px solid var(--accent);
      background: #ebf8ff;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <p>This is my individual Hello World app. Type a name and press the button.</p>

    <label for="nameInput">Your name</label>
    <input id="nameInput" type="text" placeholder="e.g. Alex" autocomplete="off">

    <button id="greetBtn" type="button">Say hello</button>

    <div id="output" role="status" aria-live="polite">Hello, World!</div>
  </main>

  <script>
    const nameInput = document.getElementById('nameInput');
    const greetBtn = document.getElementById('greetBtn');
    const output = document.getElementById('output');

    function updateGreeting() {
      const name = nameInput.value.trim();

      if (name) {
        output.textContent = `Hello, ${name}!`;
      } else {
        output.textContent = 'Hello, World!';
      }
    }

    greetBtn.addEventListener('click', updateGreeting);

    nameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        updateGreeting();
      }
    });
  </script>
</body>
</html>
